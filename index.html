<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lane League</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a; font-family: system-ui, sans-serif; user-select: none; color: #e8e6df; }
      canvas { display: block; }
      .controls { font-size: 12px; line-height: 1.7; opacity: 0.7; text-align: center; max-width: 620px; padding: 0 16px; }
      .controls kbd { background: #ffffff22; border-radius: 3px; padding: 0 4px; font-family: inherit; }

      #topbar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; align-items: center;
        padding: 5px 16px; background: #0c0f14cc; border: 1px solid #ffffff22; border-radius: 6px; font-size: 13px; font-variant-numeric: tabular-nums; pointer-events: none; white-space: nowrap; }
      #gold::before { content: '●'; color: #f2c14e; margin-right: 6px; }

      #banner { position: fixed; top: 32%; width: 100%; text-align: center; font-size: 30px; letter-spacing: 3px; opacity: 0;
        transition: opacity 300ms; text-shadow: 0 2px 8px #000; pointer-events: none; }
      #banner[data-result='win'] { color: #ffd76a; font-size: 56px; }
      #banner[data-result='loss'] { color: #ff6b5e; font-size: 56px; }
      #banner[data-result='win']::after, #banner[data-result='loss']::after { content: attr(data-sub); display: block; font-size: 15px; letter-spacing: 1px; color: #e8e6df; margin-top: 8px; }
      #floor { color: #ffd76a; }
      #score { display: flex; gap: 12px; }
      #score .you { color: #4ade80; }
      #score .them { color: #ff8a80; }
      #score .note { opacity: 0.7; }
      #foe { position: fixed; top: 10px; right: 12px; display: flex; gap: 6px; align-items: center; padding: 5px 10px; background: #0c0f14cc;
        border: 1px solid #ffffff22; border-radius: 6px; font-size: 13px; }

      /* Augment chips (HUD and menus) */
      html, body, canvas { cursor: var(--cursor, default); }
      .aug { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 5px; border-radius: 12px; font-size: 12px; border: 1px solid; background: #0008; cursor: help; }
      .aug i { font-style: normal; }
      .tier-silver { border-color: #b8c2cc; color: #dfe6ec; }
      .tier-gold { border-color: #f2c14e; color: #ffd98a; }
      .tier-prismatic { border-color: #c58bff; color: #e6c8ff; box-shadow: 0 0 8px #b36bff66; }
      .tier-item { border-color: #e0a96d; color: #f3d2a8; border-radius: 4px; }
      .none { opacity: 0.5; font-size: 12px; }
      /* Augments (top row) and items (bottom row) sit outside the bar on its left, growing outward as
         the run collects more, so the bar itself never grows into the game. */
      #abilities .perks { position: absolute; right: calc(100% + 10px); bottom: 2px; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
      #abilities .perks .row { display: flex; flex-direction: row-reverse; flex-wrap: wrap-reverse; gap: 4px; min-height: 30px;
        /* Room left of the bar (about 215px of half the bar plus margin); a full row wraps onto a new line above. */
        width: max-content; max-width: clamp(98px, calc(50vw - 215px), 234px); }
      #abilities .perks .none { display: none; }
      #abilities .perks .aug { width: 30px; height: 30px; padding: 0; justify-content: center; font-size: 16px; border-radius: 7px; border-width: 2px;
        background: #12141be6; pointer-events: auto; }
      #abilities .perks .aug.tier-item { border-radius: 4px; }

      /* Health bars */
      #bars { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .hb { position: absolute; left: 0; top: 0; height: 5px; background: #000000aa; border: 1px solid #000; border-radius: 2px; }
      .hb > div:first-child { height: 100%; transition: width 90ms linear; }
      .hb.champion { height: 8px; }
      .hb.tower, .hb.nexus { height: 9px; }
      .hb.me > div:first-child { background: #4ade80; }
      .hb.ally > div:first-child { background: #3d8bff; }
      .hb.enemy > div:first-child { background: #ef4444; }
      .hb .mp { position: absolute; left: -1px; right: -1px; top: 100%; height: 3px; background: #000000cc; border: 1px solid #000; border-top: 0; }
      .hb .mp > div { height: 100%; background: #4f8fe8; }
      .hb .lvl { position: absolute; left: -21px; top: -4px; width: 17px; height: 14px; line-height: 14px; text-align: center; font-size: 10px;
        font-weight: 700; background: #12141b; border: 1px solid #ffffff55; border-radius: 3px; }
      .hb .sh { position: absolute; top: 0; height: 100%; background: #f4f7ff; }
      .hb .cc { position: absolute; left: 0; right: 0; bottom: calc(100% + 3px); text-align: center; font-size: 10px; font-weight: 700;
        letter-spacing: 1px; color: #ffe066; text-shadow: 0 1px 2px #000; }
      .hb.marked::after { content: '◈'; position: absolute; right: -16px; top: -6px; color: #c58bff; font-size: 14px; text-shadow: 0 0 6px #b36bff; }
      .hb.locked { opacity: 0.55; }
      .hb.locked::after { content: '🔒'; position: absolute; left: -18px; top: -5px; font-size: 11px; }

      /* Ability bar */
      #abilities { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: flex-end;
        padding: 10px 12px 8px; background: #0c0f14e6; border: 1px solid #ffffff22; border-radius: 10px; }
      #abilities .portrait { position: relative; width: 62px; height: 62px; border-radius: 50%; border: 2px solid var(--accent);
        display: grid; place-items: center; font-size: 30px; color: var(--accent); background: radial-gradient(#ffffff14, #0000); }
      #abilities .portrait { overflow: visible; background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--accent) 45%, #1b1e26), #0c0f14); }
      .face { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
      .mini-portrait { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--accent); display: inline-grid; place-items: center;
        flex: none; overflow: hidden; font-size: 14px; color: var(--accent);
        background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--accent) 45%, #1b1e26), #0c0f14); }
      .mini-portrait.big { width: 52px; height: 52px; border-width: 2px; font-size: 24px; }
      #screen .badge { display: flex; align-items: center; gap: 10px; }
      #abilities .portrait .lvl { position: absolute; bottom: -6px; right: -6px; background: #12141b; border: 1px solid var(--accent);
        border-radius: 10px; min-width: 20px; text-align: center; font-size: 12px; color: #e8e6df; padding: 0 3px; }
      #abilities .slots { display: flex; gap: 6px; }
      #abilities .slot { position: relative; width: 50px; height: 50px; border-radius: 6px; background: #1b1e26; border: 2px solid #ffffff30;
        display: grid; place-items: center; font-size: 24px; color: var(--accent); }
      #abilities .slot i { font-style: normal; }
      #abilities .spells { display: flex; gap: 5px; align-items: center; margin-left: 6px; padding-left: 8px; border-left: 1px solid #ffffff1a; }
      #abilities .slot.spell { width: 38px; height: 38px; font-size: 18px; color: #e8e6df; }
      #abilities .slot.passive { width: 34px; height: 34px; font-size: 16px; align-self: center; border-radius: 50%; }
      #abilities .slot .cd { position: absolute; inset: 0; border-radius: 4px; }
      #abilities .slot .cdtext { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000; }
      #abilities .slot .key { position: absolute; bottom: -2px; right: 3px; font-size: 10px; color: #e8e6dfaa; }
      #abilities .slot .pips { position: absolute; top: 100%; left: 0; right: 0; text-align: center; font-size: 7px; letter-spacing: 1px; color: #ffd76a; margin-top: 2px; }
      /* Grey out the contents only: a filter on the slot would also dim its level-up button (an unlearned R at level 6). */
      #abilities .slot.locked > :not(.plus) { filter: grayscale(1) brightness(0.45); }
      #abilities .slot.locked { background: #14161c; border-color: #ffffff18; }
      #abilities .slot.oncd i { opacity: 0.3; }
      #abilities .slot.unavailable i { opacity: 0.25; filter: grayscale(1); }
      #abilities .slot.nomana { box-shadow: inset 0 0 0 50px #2a4a8a66; }
      #tip .cost .blood { color: #ff7a6b; }
      #abilities .slot.recast { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
      #abilities .slot.casting { border-color: #fff; }
      #abilities .slot .plus { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); width: 22px; height: 18px; padding: 0;
        border: 1px solid #ffd76a; border-radius: 4px; background: #3a2f10; color: #ffd76a; font-weight: 700; cursor: pointer; animation: pulse 1s infinite; }
      @keyframes pulse { 50% { box-shadow: 0 0 8px #ffd76a; } }
      #abilities .core { display: flex; flex-direction: column; gap: 3px; }
      #abilities .core .slots { margin: 18px 0 9px; }
      #abilities .bar { position: relative; height: 13px; background: #000000aa; border: 1px solid #ffffff22; border-radius: 3px; overflow: hidden; }
      #abilities .bar > div { height: 100%; transition: width 90ms linear; }
      #abilities .bar > span { position: absolute; inset: 0; font-size: 10px; line-height: 13px; text-align: center; text-shadow: 0 1px 1px #000; }
      #abilities .hp > div { background: linear-gradient(#4ade80, #239150); }
      #abilities .mana > div { background: linear-gradient(#6aa6ff, #3460c0); }
      #abilities .mana.bees > div { background: linear-gradient(#ffd46a, #d98a00); }
      #abilities .xp { height: 4px; }
      #abilities .xp > div { background: #b78cff; }
      /* Shrinks on narrow screens so it never runs under the ability bar. */
      #minimap { position: fixed; right: 12px; bottom: 14px; width: clamp(150px, calc(50vw - 270px), 300px); height: auto; border: 2px solid #ffffff30; border-radius: 6px; background: #0c0f14;
        box-shadow: 0 2px 10px #0008; cursor: pointer; }
      /* Bot vs bot: speed and leave controls under the top bar; no level-up buttons on the watched bar. */
      #spectate { position: fixed; top: 46px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
        padding: 5px 10px; background: #0c0f14cc; border: 1px solid #ffffff22; border-radius: 8px; font-size: 13px; z-index: 5; }
      #spectate button { font: inherit; color: #e8e6df; background: #ffffff10; border: 1px solid #ffffff2a; border-radius: 5px; padding: 2px 9px; cursor: pointer; }
      #spectate button.on { border-color: #ffd76a; color: #ffd76a; }
      #abilities.spectating .plus { display: none !important; }
      #screen .selecthead .watch { margin-top: 6px; opacity: 0.75; font-size: 13px; }
      #screen .botrow { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      #screen .botrow > small { opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; }
      #screen .botrow.blue > small { color: #7fb3ff; }
      #screen .botrow.red > small { color: #ff8a80; }
      #tip { position: fixed; display: none; bottom: 150px; left: 50%; transform: translateX(-50%); width: 320px; background: #12141bf2;
        border: 1px solid #ffffff30; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45; pointer-events: none; }
      #tip b { font-size: 14px; }
      /* Floating damage numbers (src/ui/damageNumbers.ts): white attacks, gold abilities, orange damage over time. */
      #dmgnums { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
      #dmgnums .dmg { position: absolute; left: 0; top: 0; font-weight: 800; font-size: 14px; color: #fff; white-space: nowrap;
        text-shadow: 0 0 3px #000, 0 1px 2px #000, 0 0 1px #000; font-variant-numeric: tabular-nums; }
      #dmgnums .dmg.champ { font-size: 19px; }
      #dmgnums .dmg.ability { color: #ffd76a; }
      #dmgnums .dmg.dot { color: #ff9a5a; font-size: 12px; }
      #dmgnums .dmg.dot.champ { font-size: 15px; }
      /* Online: round-trip time to the PvP server. */
      #ping { position: fixed; top: 12px; left: 12px; z-index: 6; padding: 3px 8px; border-radius: 6px; background: #12141bd9; font-size: 12px;
        font-variant-numeric: tabular-nums; pointer-events: none; border: 1px solid #ffffff22; }
      #ping.good { color: #8fe08a; } #ping.ok { color: #ffd76a; } #ping.bad { color: #ff8a7a; }
      #netstall { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 7; display: flex; flex-direction: column; align-items: center;
        gap: 2px; padding: 8px 20px; border-radius: 10px; background: #12141bf0; border: 2px solid #ff8a7a; box-shadow: 0 6px 20px #000a;
        pointer-events: none; animation: netstall 1.2s ease-in-out infinite alternate; }
      #netstall b { color: #ff8a7a; font-size: 15px; } #netstall span { font-size: 12px; opacity: 0.8; }
      @keyframes netstall { from { opacity: 0.75; } to { opacity: 1; } }
      /* Kill banner and death recap (src/ui/killFeed.ts). */
      #killbanner { position: fixed; top: 64px; left: 50%; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 10px;
        border-radius: 30px; background: #12141bf0; border: 2px solid #ffd76a; box-shadow: 0 6px 20px #000a; pointer-events: none; transform-origin: 50% 50%; }
      #killbanner.bad { border-color: #ff6b5e; }
      #killbanner .mini-portrait { width: 40px; height: 40px; }
      #killbanner .arrow { font-size: 18px; opacity: 0.8; }
      #killbanner .exec { width: 40px; height: 40px; display: grid; place-items: center; font-size: 24px; }
      #killbanner b { font-size: 17px; margin-left: 6px; white-space: nowrap; }
      #killbanner.good b { color: #ffd76a; }
      #killbanner.bad b { color: #ff8a7a; }
      #deathrecap { position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%); z-index: 6; width: min(360px, 92vw); padding: 10px 12px;
        background: #12141bf2; border: 1px solid #ff6b5e88; border-radius: 10px; box-shadow: 0 6px 20px #000a; pointer-events: none; font-size: 12.5px; }
      #deathrecap .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
      #deathrecap .head b { color: #ff8a7a; font-size: 14px; }
      #deathrecap .head span { opacity: 0.6; font-size: 11.5px; }
      #deathrecap .rrow { position: relative; display: flex; align-items: center; gap: 8px; padding: 4px 8px; margin-bottom: 3px; border-radius: 6px;
        background: #ffffff0a; overflow: hidden; }
      #deathrecap .rrow i { font-style: normal; width: 18px; text-align: center; z-index: 1; }
      #deathrecap .rrow .lbl { flex: 1; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #deathrecap .rrow b { z-index: 1; font-variant-numeric: tabular-nums; }
      #deathrecap .rrow kbd { font-size: 10px; padding: 0 4px; }
      #deathrecap .rrow .fill { position: absolute; left: 0; top: 0; bottom: 0; opacity: 0.28; border-radius: 6px; }
      #deathrecap .rrow.attack .fill { background: #e8e6df; }
      #deathrecap .rrow.ability .fill { background: #ffd76a; }
      #deathrecap .rrow.effect .fill { background: #ff9a5a; }
      #deathrecap .rrow.minion .fill { background: #7aa7ff; }
      #deathrecap .rrow.tower .fill { background: #b8c2cc; }
      /* Instant tooltip for anything with a title (src/ui/hoverTip.ts), styled like #tip. */
      #hovertip { position: fixed; left: 0; top: 0; display: none; max-width: 280px; z-index: 1000; background: #12141bf2; color: #e8e6df;
        border: 1px solid #ffffff30; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; pointer-events: none;
        box-shadow: 0 4px 14px #0008; }
      #hovertip b { font-size: 13.5px; }
      #tip small { opacity: 0.6; }
      #tip .cost { display: block; color: #9fc4ff; opacity: 0.9; }
      #tip p { margin: 5px 0; }

      /* Champion select */
      /* "How to play" (src/ui/howToPlay.ts): a modal over the home screen. */
      #howto { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
        background: #05070bcc; }
      #howto .panel { position: relative; width: min(680px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 22px 26px;
        background: #151922; border: 1px solid #ffffff26; border-radius: 14px; box-shadow: 0 20px 60px #000c; color: #e8e6df; text-align: left; line-height: 1.45; }
      #howto h2 { margin: 0 0 6px; font-size: 24px; color: #f3d2a8; }
      #howto h3 { margin: 18px 0 6px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #f2c14e; }
      #howto p, #howto li { font-size: 14px; margin: 4px 0; }
      #howto ul { margin: 4px 0; padding-left: 20px; }
      #howto .goals li b { color: #f3d2a8; }
      #howto .keys { border-collapse: collapse; width: 100%; font-size: 14px; }
      #howto .keys td { padding: 5px 8px; border-top: 1px solid #ffffff12; vertical-align: top; }
      #howto .keys td:first-child { white-space: nowrap; width: 1%; }
      #howto kbd { background: #ffffff22; border: 1px solid #ffffff22; border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; margin-right: 2px;
        font-family: inherit; font-size: 12px; }
      #howto .close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid #ffffff26;
        background: #ffffff10; color: inherit; font-size: 16px; cursor: pointer; }
      #howto .close:hover { background: #ffffff22; }
      #screen { position: fixed; inset: 0; background: #0b0d12d9; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 18px; z-index: 10; overflow-y: auto; padding: 24px 0; box-sizing: border-box; }
      #screen h1 { margin: 0; font-weight: 600; letter-spacing: 2px; font-size: 26px; }
      #screen .cards { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
      #screen .card { width: 300px; text-align: left; color: inherit; font: inherit; background: #151922; border: 2px solid #ffffff22; border-radius: 12px;
        padding: 16px 18px; cursor: pointer; transition: transform 120ms, border-color 120ms; }
      #screen .card:hover { transform: translateY(-3px); border-color: var(--accent); }
      #screen .name { font-size: 24px; font-weight: 700; color: var(--accent); }
      #screen .name span { font-size: 14px; font-weight: 400; color: #e8e6dfaa; }
      #screen .blurb { font-size: 13px; line-height: 1.5; opacity: 0.85; }
      #screen ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
      #screen li { display: flex; gap: 8px; align-items: center; font-size: 13px; }
      #screen li i { font-style: normal; width: 22px; text-align: center; color: var(--accent); font-size: 16px; }
      #screen li small { margin-left: auto; opacity: 0.5; }
      /* Champion select over the 3D stage: title on top, cards along the bottom */
      /* Champion select: portraits on top, the 3D stage shows through on the left, the kit panel on the right. */
      #screen.select { background: linear-gradient(90deg, #0b0d1200 0%, #0b0d1200 45%, #0b0d12c0 70%), linear-gradient(#0b0d12cc 0%, #0b0d1200 25%);
        justify-content: flex-start; gap: 14px; padding: 20px 0 14px; }
      #screen .selecthead { text-align: center; }
      #screen .selecthead h1 { margin-bottom: 10px; }
      #screen .selecthead .sub { margin: 0; }
      #screen .roster { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 0 16px; max-width: 900px; }
      #screen .pick { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; padding: 6px 2px; background: none;
        border: 0; border-radius: 10px; cursor: pointer; opacity: 0.6; transition: opacity 0.15s, transform 0.15s; }
      #screen .pick:hover { opacity: 0.9; transform: translateY(-2px); }
      #screen .pick.on { opacity: 1; background: #ffffff0d; }
      #screen .pick .mini-portrait { width: 58px; height: 58px; border-width: 2px; font-size: 26px; }
      #screen .pick.on .mini-portrait { box-shadow: 0 0 0 2px #0b0d12, 0 0 0 4px var(--accent), 0 0 18px var(--accent); }
      #screen .pick .pname { font-size: 12px; font-weight: 600; color: var(--accent); }
      /* Experimental champions (no model yet): hidden unless the toggle is on, and tagged with a flask. */
      #screen.select .pick.experimental { display: none; position: relative; }
      #screen.select.show-experimental .pick.experimental { display: flex; }
      #screen .pick.experimental::after { content: '🧪'; position: absolute; top: 2px; right: 6px; font-size: 14px; }
      #screen .homelinks { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 6px; }
      #screen .homelinks .watch { margin-top: 0; }
      #screen .exptoggle { display: flex; align-items: center; gap: 5px; font-size: 13px; opacity: 0.75; cursor: pointer; user-select: none; }
      #screen .exptoggle input { margin: 0; accent-color: #c9a5ff; }
      #screen .selectmain { box-sizing: border-box; flex: 1; width: 100%; max-width: 1200px; display: flex; align-items: center; gap: 24px; padding: 0 24px; min-height: 0; }
      #screen .selectmain .stagegap { flex: 1; min-height: 40vh; }
      #screen .champinfo { box-sizing: border-box; width: min(420px, 100%); background: #151922e6; border: 1px solid #ffffff1f; border-radius: 12px; padding: 16px 18px;
        display: flex; flex-direction: column; gap: 10px; }
      #screen .champinfo .blurb { margin: 0; font-size: 13px; }
      #screen .champinfo .abilities { gap: 9px; }
      #screen .champinfo .abilities li { align-items: flex-start; gap: 10px; }
      #screen .champinfo .abilities i { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px;
        background: #ffffff0f; font-size: 17px; }
      #screen .champinfo .abilities b { font-size: 13px; }
      #screen .champinfo .abilities small { margin-left: 4px; opacity: 0.5; font-size: 11px; }
      #screen .champinfo .abilities kbd { margin-left: 4px; font-size: 10px; background: #ffffff22; border-radius: 3px; padding: 0 4px; font-family: inherit; }
      #screen .champinfo .abilities p { margin: 2px 0 0; font-size: 12px; line-height: 1.4; opacity: 0.8; }
      #screen .champinfo .best { margin: 0; }
      /* Start stays in reach while the panel scrolls. */
      #screen .champinfo .actions { justify-content: flex-end; position: sticky; bottom: -16px; margin: 0 -18px -16px; padding: 10px 18px 14px;
